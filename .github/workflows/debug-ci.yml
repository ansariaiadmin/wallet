name: CI debug

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: smart-wallet

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: smart-wallet/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Test with a captured log
        run: pnpm test 2>&1 | tee test-output.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: smart-wallet/test-output.txt
